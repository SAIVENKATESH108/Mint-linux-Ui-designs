# ==============================================================================
# macOS Sequoia Design Tokens Specification for Linux Mint XFCE
# Target Display: 1280x1024 @ 60Hz (X11)
# Target Architecture: Ivy Bridge Core i3-3220, 12GB RAM, NVIDIA GT 610 (nouveau)
# ==============================================================================

[colors]
# Core macOS Sequoia Palette
accent_blue="#007aff"
accent_blue_hover="#0062d2"
accent_graphite="#8e8e93"

# Window Control Traffic Lights
traffic_close="#ff5f56"
traffic_close_border="#e0443e"
traffic_minimize="#ffbd2e"
traffic_minimize_border="#dea123"
traffic_maximize="#27c93f"
traffic_maximize_border="#1aab29"

# Panel & Menus (Dark Sequoia Theme)
panel_bg="rgba(30, 30, 32, 0.85)"
panel_bg_solid="#1e1e20"
panel_fg="#f5f5f7"
panel_fg_muted="#a1a1a6"
panel_border="rgba(255, 255, 255, 0.12)"
menu_bg="rgba(38, 38, 42, 0.92)"
menu_selected_bg="#007aff"
menu_selected_fg="#ffffff"

# Window Surfaces
window_bg="#242426"
window_header_bg="#2b2b2d"
window_header_inactive="#212123"
window_fg="#f5f5f7"
window_border="rgba(255, 255, 255, 0.15)"

# Dock (Plank Sequoia Theme)
dock_bg="rgba(35, 35, 40, 0.70)"
dock_border="rgba(255, 255, 255, 0.18)"
dock_indicator="#ffffff"

# Launcher / Spotlight (Rofi)
spotlight_bg="rgba(30, 30, 35, 0.92)"
spotlight_input_bg="rgba(255, 255, 255, 0.08)"
spotlight_selected_bg="#007aff"
spotlight_text="#f5f5f7"
spotlight_text_muted="#8e8e93"

[radii]
window_radius="10px"
dock_radius="14px"
panel_radius="0px"
spotlight_radius="14px"
button_radius="6px"
menu_radius="8px"
tooltip_radius="6px"

[spacing]
panel_height="26px"
panel_icon_size="16px"
dock_icon_size="44px"
dock_zoom_percent="120"
dock_item_padding="4px"
spotlight_width="600px"
spotlight_padding="16px"
margin_xs="4px"
margin_sm="8px"
margin_md="12px"
margin_lg="16px"

[typography]
font_family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
font_size_panel="10"
font_size_menu="10"
font_size_window_title="11"
font_size_spotlight="12"
font_size_widgets="10"

[compositor_lite]
# Optimized for NVIDIA GeForce GT 610 (Fermi) with nouveau driver
backend="xrender"
vsync="true"
shadows="true"
shadow_radius="8"
shadow_opacity="0.35"
blur="false"
fading="true"
fade_in_step="0.05"
fade_out_step="0.05"

[compositor_full]
# For systems with capable GLX / OpenGL
backend="glx"
vsync="true"
shadows="true"
shadow_radius="16"
shadow_opacity="0.45"
blur="true"
blur_method="dual_kawase"
blur_strength="4"
fading="true"
fade_in_step="0.03"
fade_out_step="0.03"
