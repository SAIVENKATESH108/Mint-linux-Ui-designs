name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-control-center:
    name: Control Center & Sequoia UI Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              python3 \
              python3-gi \
              python3-gi-cairo \
              gir1.2-gtk-3.0 \
              xvfb \
              xfwm4 \
              wmctrl \
              xdotool \
              x11-utils \
              dbus-x11 \
              pulseaudio \
              playerctl \
              network-manager

      - name: Run GTK3 CSS Validator Tests
        run: |
          python3 -m unittest tests/test_css_validator.py -v

      - name: Run Sequoia UI Toolkit Unit Tests
        run: |
          xvfb-run -a dbus-run-session python3 -m unittest tests/test_sequoia_ui.py -v

      - name: Run Control Center CSS Unit Tests
        run: |
          xvfb-run -a dbus-run-session python3 tests/test_control_center_css.py

      - name: Run Geometry Settle Logic Unit Tests
        run: |
          python3 -m unittest tests/test_geometry_settle.py -v

      - name: Run Keyboard Shortcuts & Legacy Scan Unit Tests
        run: |
          python3 -m unittest tests/test_keys.py tests/test_keys_scan.py -v

      - name: Run DeskWidgets Layout & Overlap Tests
        run: |
          python3 -m unittest tests/test_deskwidgets_layout.py -v

      - name: Run DeskWidgets Self-Healing Limits Tests
        run: |
          python3 -m unittest tests/test_deskwidgets_self_heal.py -v

      - name: Run DeskWidgets Paths & Directories Tests
        run: |
          python3 -m unittest tests/test_deskwidgets_paths.py -v

      - name: Run Conky Check Classifier & Evaluator Unit Tests
        run: |
          python3 -m unittest tests/test_conky_check.py -v

      - name: Run Control Center Smoke Tests (Xvfb + xfwm4)
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" dbus-run-session bash -c "
            xfwm4 --replace &
            sleep 1
            python3 tests/test_control_center_smoke.py
          "

      - name: Run DeskWidgets Integration Tests (Fake Conky under Xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" dbus-run-session bash -c "
            xfwm4 --replace &
            sleep 1
            python3 -m unittest tests/test_deskwidgets_integration.py -v
          "

      - name: Run UI Smoke & Screenshot Suite (Xvfb + xfwm4)
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" dbus-run-session bash -c "
            xfwm4 --replace &
            sleep 1
            python3 tests/test_ui_smoke.py
          "

      - name: Upload UI Screenshots as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: ignore
