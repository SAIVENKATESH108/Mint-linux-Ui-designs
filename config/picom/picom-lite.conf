# ==============================================================================
# Picom Lite Configuration - Optimized for Legacy GPU (NVIDIA GT 610 / nouveau)
# Extracted from reference/design-tokens.conf [compositor_lite]
# ==============================================================================

# Backend & Performance
backend = "xrender";
vsync = true;
use-damage = true;
mark-wmwin-focused = true;
mark-ovld-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Shadows (Subtle macOS Style)
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'Plank'",
  "class_g = 'xfce4-panel'",
  "_GTK_FRAME_EXTENTS@:c",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# Fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 10;
fade-exclude = [];

# Transparency & Opacity Rules
inactive-opacity = 0.98;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'Plank'",
  "class_g = 'Rofi'"
];

# Blur: Completely disabled in Lite mode for smooth 60fps on Fermi architecture
blur-background = false;

# Window Type Specific Rules
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; shadow = true; };
  dropdown_menu = { opacity = 0.98; shadow = true; };
};
