# ==============================================================================
# Picom 10.2 Lite Configuration - Optimized for Linux Mint 22.3 XFCE
# Target Hardware: Intel Core i3-3220, NVIDIA GT 610 (GF119) / nouveau
# Screen: HDMI-1 1280x1024 @ 60.02Hz
#
# Command to test:
#   xfconf-query -c xfwm4 -p /general/use_compositing -s false
#   picom --config config/picom/picom-lite.conf -b
#
# Command to restore XFCE compositor:
#   pkill picom; xfconf-query -c xfwm4 -p /general/use_compositing -s true
# ==============================================================================

# Backend & GLX (Picom 10.2)
backend = "glx";
vsync = true;
use-damage = true;

# Geometry: Rounded Corners (Picom 10.2)
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Xfce4-panel'"    # UNVERIFIED
];

# Drop Shadows (Subtle macOS Style)
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.30;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'conky'",         # UNVERIFIED
  "class_g = 'Plank'",         # UNVERIFIED
  "class_g = 'Xfce4-panel'",   # UNVERIFIED
  "_GTK_FRAME_EXTENTS@:c"
];

# Fading (Lightweight window transitions)
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 10;

# Blur: DISABLED in Lite mode (eliminates GPU shader pipeline stalls on GT 610)
blur-background = false;

# Opacity Rules
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; shadow = true; };
  dropdown_menu = { opacity = 0.98; shadow = true; };
};
