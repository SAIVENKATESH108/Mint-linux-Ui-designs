# ==============================================================================
# Picom 10.2 Glass Configuration (Optional Profile with Dual-Kawase Blur)
# Target Hardware: Intel Core i3-3220, NVIDIA GT 610 (GF119) / nouveau
# Screen: HDMI-1 1280x1024 @ 60.02Hz
# Note: Blur is restricted ONLY to panel, dock, and widgets to minimize GPU load
#
# Command to test:
#   xfconf-query -c xfwm4 -p /general/use_compositing -s false
#   picom --config config/picom/picom-glass.conf -b
#
# Command to restore XFCE compositor:
#   pkill picom; xfconf-query -c xfwm4 -p /general/use_compositing -s true
# ==============================================================================

# Backend & GLX (Picom 10.2 - without deprecated stencil/copy options)
backend = "glx";
vsync = true;
use-damage = true;

# Geometry: Rounded Corners (Picom 10.2)
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Xfce4-panel'"    # UNVERIFIED
];

# Drop Shadows
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.40;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'conky'",         # UNVERIFIED
  "class_g = 'Plank'",         # UNVERIFIED
  "class_g = 'Xfce4-panel'",   # UNVERIFIED
  "_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 8;

# Dual-Kawase Blur (Picom 10.2)
# Blur restricted strictly to panel, dock, and widgets via "!" negation match rule
blur: {
  method = "dual_kawase";
  strength = 4;
  background = true;
};

# Note: Exclude rule matches everything that is NOT panel, dock, or conky.
# Valid in Picom 10.2 grammar (! before parens). Equivalent to:
# class_g != 'Xfce4-panel' && class_g != 'Plank' && class_g != 'conky'
blur-background-exclude = [
  "! (class_g = 'Xfce4-panel' || class_g = 'Plank' || class_g = 'conky')", # UNVERIFIED: Blurs ONLY panel, dock, widgets
  "_GTK_FRAME_EXTENTS@:c"
];

# Opacity
inactive-opacity = 0.98;
active-opacity = 1.0;
frame-opacity = 1.0;

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; shadow = true; };
  dropdown_menu = { opacity = 0.95; shadow = true; };
};
