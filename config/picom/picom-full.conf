# ==============================================================================
# Picom Full Configuration - High Visual Fidelity (GLX & Dual-Kawase Blur)
# Extracted from reference/design-tokens.conf [compositor_full]
# ==============================================================================

# Backend & GLX Optimizations
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
vsync = true;
use-damage = true;
mark-wmwin-focused = true;
mark-ovld-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Corner Radius (macOS Sequoia Style)
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'xfce4-panel'"
];

# Shadows
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.45;
shadow-offset-x = -16;
shadow-offset-y = -16;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'Plank'",
  "class_g = 'xfce4-panel'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 8;

# Dual-Kawase Blur (macOS Sequoia Frosted Glass)
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "class_g = 'Conky'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Opacity Rules
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; shadow = true; };
  dropdown_menu = { opacity = 0.95; shadow = true; };
};
